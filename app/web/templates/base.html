<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9Oer+R5arTY4oAGn3UuSa3A1w4oS6yQvZ6jIW3"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <div class="app-shell">
      <nav class="navbar bg-white">
        <div class="container-fluid px-4">
          <div class="d-flex align-items-center gap-4">
            <a class="navbar-brand mb-0 h1" href="/">{{ app_name }}</a>
            <div class="nav">
              <a class="nav-link px-2" href="/">Dashboard</a>
              <a class="nav-link px-2" href="/files/upload">Upload</a>
              <a class="nav-link px-2" href="/admin/logs">Logs</a>
            </div>
          </div>
          <span class="badge text-bg-light border">v{{ app_version }} / {{ environment }}</span>
        </div>
      </nav>
      <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
